name: Update GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *"  
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate GitHub Stats
        run: |
          curl "https://github-readme-stats.vercel.app/api?username=Macplayz&theme=midnight-purple&hide_border=true" -o github-stats.svg
          curl "https://streak-stats.demolab.com?user=Macplayz&theme=midnight-purple&hide_border=true" -o github-streak.svg

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add github-stats.svg github-streak.svg
          git commit -m "chore: update github stats" || echo "No changes"
          git push
